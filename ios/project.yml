# XcodeGen spec — generates RunningForm.xcodeproj from these sources.
# Run `xcodegen generate` (or ./setup.sh) after cloning / adding files.
name: RunningForm
options:
  bundleIdPrefix: com.kevinzhang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  RunningForm:
    type: application
    platform: iOS
    sources:
      - path: RunningForm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinzhang.formcheck
        PRODUCT_NAME: RunningForm
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RunningForm/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
